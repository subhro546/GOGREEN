[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "RAZORPAY_KEY_ID,NEXT_PUBLIC_RAZORPAY_KEY_ID,CLOUDINARY_CLOUD_NAME,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_FROM_SMS_NUMBER,TWILIO_FROM_WHATSAPP_NUMBER,ADMIN_EMAIL,ADMIN_PHONE"

[[plugins]]
  package = "@netlify/plugin-nextjs"
